apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-java
  namespace: mt-saas-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-java
  template:
    metadata:
      labels:
        app: api-java
    spec:
      initContainers:
        - name: create-app-java-db
          image: postgres:16
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: POSTGRES_PASSWORD
          # idempotent: safe to run against an existing pvc that already has app_java
          command:
            - sh
            - -c
            - >
              psql -h postgres -U app -d app -tc
              "select 1 from pg_database where datname='app_java'" | grep -q 1 ||
              createdb -h postgres -U app app_java
      containers:
        - name: api-java
          image: ghcr.io/akshitanchan/mt-saas-api-java:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-java
  namespace: mt-saas-api
spec:
  type: NodePort
  selector:
    app: api-java
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
