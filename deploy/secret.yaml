apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: mt-saas-api
type: Opaque
stringData:
  # dev placeholders only, matching docker-compose; real values come from the environment, never from this file
  POSTGRES_PASSWORD: app
  DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
  JWT_SECRET: dev-secret
  MAGIC_LINK_PEPPER: dev-pepper
